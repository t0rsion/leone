name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Check the tag and release tree
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          scripts/check-public-tree.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux-x86_64:
    needs: check-version
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.3.1-devel-ubuntu24.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates curl file git gzip jq python3 pkg-config
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Rust 1.92
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.92.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add --toolchain 1.92.0 rustfmt clippy
      - name: Install release policy tools
        run: |
          cargo +1.92.0 install cargo-deny --version 0.19.0 --locked
          cargo +1.92.0 install rust-code-analysis-cli --version 0.0.25 --locked
      - name: Check the public tree
        run: scripts/check-public-tree.sh
      - name: Check source provenance and Python tests
        shell: bash
        run: |
          python3 scripts/source_inputs.py check "$(jq -er '.source_commit' receipts/batched-service-study.json)"
          python3 -m unittest discover -s tests
          scripts/test-check-public-tree.sh
      - name: Check formatting
        run: cargo +1.92.0 fmt --all --check
      - name: Check lints
        run: cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Check complexity
        run: scripts/check-rust-complexity.sh
      - name: Check dependencies and licenses
        run: cargo +1.92.0 deny check
      - name: Test the workspace
        run: cargo +1.92.0 test --workspace --locked
      - name: Check documentation
        run: cargo +1.92.0 doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check generated release report
        shell: bash
        run: |
          rendered=$(mktemp)
          scripts/render-release-evidence.sh "$rendered" >/dev/null
          cmp docs/release-evidence.md "$rendered"
      - name: Build release archives
        run: scripts/package-release.sh
      - name: Record dynamic linkage
        shell: bash
        run: |
          version=${{ needs.check-version.outputs.version }}
          ldd target/release/leone > "dist/leone-$version-linux-x86_64.linkage.txt" || true
      - name: Check archive hashes and reproducibility
        shell: bash
        run: |
          version=${{ needs.check-version.outputs.version }}
          first=$(mktemp -d)
          cp "dist/leone-$version-linux-x86_64.tar.gz.sha256" "$first/runtime.sha256"
          cp "dist/leone-$version-evidence.tar.gz.sha256" "$first/evidence.sha256"
          scripts/package-release.sh >/dev/null
          cd dist
          sha256sum -c -- *.sha256
          cmp "$first/runtime.sha256" "leone-$version-linux-x86_64.tar.gz.sha256"
          cmp "$first/evidence.sha256" "leone-$version-evidence.tar.gz.sha256"
      - name: Check extracted archives
        shell: bash
        run: |
          version=${{ needs.check-version.outputs.version }}
          stage=$(mktemp -d)
          tar -xzf "dist/leone-$version-linux-x86_64.tar.gz" -C "$stage"
          tar -xzf "dist/leone-$version-evidence.tar.gz" -C "$stage"
          runtime_root="$stage/leone-$version-linux-x86_64"
          evidence_root="$stage/leone-$version-evidence"
          scripts/check-public-tree.sh "$runtime_root"
          scripts/check-public-tree.sh "$evidence_root"
          (cd "$runtime_root" && sha256sum -c MANIFEST.sha256)
          (cd "$evidence_root" && sha256sum -c MANIFEST.sha256)
          test "$("$runtime_root/bin/leone" --version)" = "leone $version"
          if strings "$runtime_root/bin/leone" | grep -Fq "$GITHUB_WORKSPACE"; then
            echo "release binary contains the workspace path" >&2
            exit 1
          fi
          if readelf -d "$runtime_root/bin/leone" | grep -Eq 'RPATH|RUNPATH'; then
            echo "release binary contains a runtime search path" >&2
            exit 1
          fi
          if ldd "$runtime_root/bin/leone" | grep -q 'not found'; then
            echo "release binary has an unresolved library" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: leone-${{ needs.check-version.outputs.version }}-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.linkage.txt
          if-no-files-found: error

  github-release:
    needs: [check-version, linux-x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: leone-${{ needs.check-version.outputs.version }}-linux-x86_64
          path: dist
      - name: Create aggregate checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --target "$GITHUB_SHA" \
              --title "Leone ${{ needs.check-version.outputs.version }}" \
              --generate-notes
          fi
