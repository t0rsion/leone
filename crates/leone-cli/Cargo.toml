[package]
name = "leone-cli"
description = "Command-line interface for the Leone LLM inference engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[[bin]]
name = "leone"
path = "src/main.rs"
# The library owns the shared `leone` rustdoc output directory.
doc = false

[features]
default = ["cuda"]
cuda = ["dep:leone-cuda"]
metal = ["dep:leone-metal"]

[dependencies]
chrono.workspace = true
ctrlc.workspace = true
ed25519-dalek.workspace = true
leone = { version = "0.4.0", path = "../leone" }
leone-cuda = { version = "0.4.0", path = "../leone-cuda", optional = true }
leone-gguf = { version = "0.4.0", path = "../leone-gguf" }
leone-metal = { version = "0.4.0", path = "../leone-metal", optional = true }
leone-receipt = { version = "0.4.0", path = "../leone-receipt" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
sha2.workspace = true
